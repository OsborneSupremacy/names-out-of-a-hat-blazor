name: _ build lambda functions and apply terraform

on:
  workflow_call:
    inputs:
      tfstate_bucket:
        description: "Name of the S3 bucket to store Terraform state"
        required: true
        type: string
      tfstate_key:
        description: "Key prefix for Terraform state files in the S3 bucket"
        required: true
        type: string
      debug_provider_log:
        description: "Capture AWS provider debug logs during apply. Off by default: it produces tens of MB per run."
        required: false
        type: boolean
        default: false
    secrets:
      AWS_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build & package Lambdas
        run: bash scripts/build-lambdas.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: iac/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ inputs.tfstate_bucket }}" \
            -backend-config="key=${{ inputs.tfstate_key }}" \
            -backend-config="region=us-east-1"

      - name: Terraform Validate
        working-directory: iac/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: iac/terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: iac/terraform
        env:
          TF_LOG_PROVIDER: ${{ inputs.debug_provider_log && 'DEBUG' || '' }}
          TF_LOG_PATH: ${{ inputs.debug_provider_log && format('{0}/tf-provider.log', runner.temp) || '' }}
        run: terraform apply -auto-approve tfplan

      # Some API Gateway refusals are indistinguishable from a hang at the default log level.
      # A quota error answers HTTP 429 with LimitExceededException, which the AWS provider reads
      # as throttling and retries twenty-five times with backoff; since these resources support no
      # timeouts block, the apply just prints "Still creating..." for a quarter of an hour and
      # never says what is wrong. Turn debug_provider_log on to see the actual response.
      - name: Surface API Gateway retries
        if: always() && inputs.debug_provider_log
        run: |
          grep -iE "RequestValidator|TooManyRequests|ConflictException|retrying|LimitExceeded" \
            "${{ runner.temp }}/tf-provider.log" | tail -100 || echo "no matching log lines"

      - name: Upload provider log
        if: always() && inputs.debug_provider_log
        uses: actions/upload-artifact@v4
        with:
          name: tf-provider-log
          path: ${{ runner.temp }}/tf-provider.log
          if-no-files-found: ignore
