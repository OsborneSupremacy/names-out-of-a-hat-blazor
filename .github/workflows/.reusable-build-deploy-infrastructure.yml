name: _ build lambda functions and apply terraform

on:
  workflow_call:
    inputs:
      tfstate_bucket:
        description: "Name of the S3 bucket to store Terraform state"
        required: true
        type: string
      tfstate_key:
        description: "Key prefix for Terraform state files in the S3 bucket"
        required: true
        type: string
    secrets:
      AWS_ROLE_ARN:
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Build & package Lambdas
        run: bash scripts/build-lambdas.sh

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        working-directory: iac/terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ inputs.tfstate_bucket }}" \
            -backend-config="key=${{ inputs.tfstate_key }}" \
            -backend-config="region=us-east-1"

      - name: Terraform Validate
        working-directory: iac/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: iac/terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: iac/terraform
        env:
          TF_LOG_PROVIDER: DEBUG
          TF_LOG_PATH: ${{ runner.temp }}/tf-provider.log
        run: terraform apply -auto-approve tfplan

      # API Gateway's control plane retries TooManyRequestsException and ConflictException
      # inside the AWS SDK, silently. At the default log level a stuck create shows as nothing
      # but "Still creating..." forever, and aws_api_gateway_request_validator supports no
      # timeouts block, so Terraform never gives up on its own. This surfaces the real error.
      - name: Surface API Gateway retries
        if: always()
        run: |
          grep -iE "RequestValidator|TooManyRequests|ConflictException|retrying|LimitExceeded" \
            "${{ runner.temp }}/tf-provider.log" | tail -100 || echo "no matching log lines"

      - name: Upload provider log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tf-provider-log
          path: ${{ runner.temp }}/tf-provider.log
          if-no-files-found: ignore
